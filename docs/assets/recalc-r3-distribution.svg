<title id="r3-title">Historical R3 mechanism effect was concentrated</title>
<desc id="r3-desc">Historical R3 full-cell iteration mechanism population: 30 workloads ranked by ON/OFF warm runtime ratio, OFF rc3-equivalent predecessor control versus ON iteration candidate. 23 workloads faster under ON, 7 slower. Median ON/OFF ratio 0.913, about 8.75 percent lower. The top three workloads supplied 84.2 percent of positive savings; the largest regression was 49.7 milliseconds. The aggregate effect was concentrated and must not be interpreted as a typical-workload effect. Historical mechanism evidence, not released-product task performance.</desc>
