<title id="sel-title">How Recalc handles an invocation</title>
<desc id="sel-desc">Schematic flowchart with no timing. An ordinary Python openpyxl invocation first passes conservative admission. Not-eligible invocations run on genuine openpyxl reference execution. Direct-path eligible invocations may have supported reads served from validated workbook read state. Both paths merge into execution, where fallback to genuine openpyxl remains possible, and the outcome is recorded in a receipt. A separate external observer panel shows before, run, and after observation recording effects and assurance; it observes only and executes no spreadsheet semantics.</desc>
