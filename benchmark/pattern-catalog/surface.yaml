# The collapse the gate asked for: fourteen surface names resolve to six geometries.
# Read this before proposing a design against a pattern id -- a design that addresses
# `run-boundary` addresses four patterns at once, and a design against one of the four
# addresses a quarter of a mechanism.
mechanisms:
  run-boundary:
    patterns: [B-empty-body, B-listed-continuation, C-empty-prior]
    cases: [t-04-04-d13, fm-03-02-m4, fm-01-02-m3, t-10-02-e10]
    one_line: A uniform run written across a range whose first or last cell needs different treatment.
    lever: constraint (substitution for fm-01-02-m3, where information was already spent and declined)
  identity-choice:
    patterns: [A-ambiguous-base, F-oneshot-identity]
    cases: [t-16-12-j10]
    one_line: The targeted cell is right and the formula's identity is wrong.
    lever: none -- no fact about the input separates the candidates
  sign-convention:
    patterns: [E-mixed-sign]
    cases: [t-09-03-d24, t-14-05-m35]
    one_line: Right magnitude, wrong sign, on a row with two column kinds.
    lever: none
  representative-selection:
    patterns: [H-wrong-representative, I-sibling-representative, J-drowned, read-budget]
    cases: [d-02-05-d7, d-09-09-h107]
    one_line: The shortlist named a cell, the model acted on it, and it was not the one that mattered.
    lever: information for the silent-formula half (refuted); constraint for the read-budget half (measured by ladder arm C)
  error-token-policy:
    patterns: [G-preserve-error-token]
    cases: [d-01-05-d53]
    one_line: The golden keeps an error token the model removed.
    lever: constraint
  instruction-scope:
    patterns: [D-gappy-instruction]
    cases: [t-09-01-c8]
    one_line: The model obeyed the sheet and the golden contradicts the sheet.
    lever: none
  serialization:
    patterns: [L-formula-spelling, K-preserve-compare]
    cases: [d-01-02-c36]
    one_line: Our save path or our compare, not the model.
    lever: none

parked_do_not_visit:
  - Debugging:04_04 same-string format miss
  - Debugging:10_02 label prefix (-) OpEx
  - Debugging:06_09 on the 297 (different cell than the 15)
  - Debugging:02_07 drown (duplicate of 02_09)
  - 12 Debugging no-workbooks (harness, not compiler)
  - more Template written_wrong blanks (71; four visits suffice)
