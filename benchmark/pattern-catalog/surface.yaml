# Claimed patterns. Establishing case ids must exist under cases/.
# status: established | parked
# design: later | never
# decision: target | attend | emit | accept | harness

census:
  run: glm-5.3-flash-nonvisual-297-1
  autopsy: v2-boundary-and-successful-read
  exact: 24
  scored: 297
  notes:
