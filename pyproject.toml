[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "librecalc-mcp"
version = "0.1.0"
description = "An agent-native programmable LibreOffice Calc world exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "openai>=3.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "ruff>=0.16,<0.17",
]

[project.scripts]
librecalc-mcp = "librecalc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/librecalc_mcp"]

[tool.pytest.ini_options]
# The SWE-agent bundle is not a package; tests reach its instruments directly.
pythonpath = ["src", ".", "benchmark/sweagent/librecalc/lib"]
testpaths = ["tests"]
markers = [
  "uno: integration tests requiring a running LibreOffice UNO service",
]

[tool.ruff]
line-length = 100

# Ruff's default rule set widens between minor releases, which silently moved this
# project's hygiene bar once already. The version is pinned above and deviations are
# enumerated here so `ruff check .` means the same thing on every machine.
[tool.ruff.lint.per-file-ignores]
# architecture.md designates backend/uno*.py as the only layer allowed to know
# com.sun.star details. UNO property support is discovered at runtime, not declared,
# so probing it requires catching bare Exception. These probes must record what they
# dropped -- see _ApplyLog -- and must never silently pass on a write path.
"src/librecalc_mcp/backend/uno_charts.py" = ["BLE001", "S110", "S112"]
"src/librecalc_mcp/backend/uno.py" = ["BLE001", "S110", "S112"]
# Optional test dependencies are probed the same way, to skip rather than error.
"tests/**" = ["BLE001"]
