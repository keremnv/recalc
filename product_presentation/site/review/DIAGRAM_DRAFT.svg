<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="LibreCalc reuse and fallback diagram">
  <desc>DRAFT for discussion. Your unchanged script is checked: reads LibreCalc can serve load the saved decode; anything else runs on ordinary openpyxl. Both produce the same result, and the receipt records which path was taken.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- script -->
  <rect x="220" y="12" width="200" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="37" text-anchor="middle" font-size="14" fill="#111">your unchanged script</text>

  <line x1="320" y1="52" x2="320" y2="66" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- decision -->
  <rect x="180" y="68" width="280" height="48" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" font-size="14" fill="#111">can this read reuse the saved decode?</text>
  <text x="320" y="106" text-anchor="middle" font-size="12" fill="#555">LibreCalc checks before running</text>

  <!-- fork -->
  <line x1="270" y1="116" x2="180" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="116" x2="460" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="238" y="140" text-anchor="middle" font-size="12" fill="#1a7f37">yes</text>
  <text x="402" y="140" text-anchor="middle" font-size="12" fill="#555">no</text>

  <!-- reuse branch -->
  <rect x="80" y="150" width="200" height="48" rx="8" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="180" y="170" text-anchor="middle" font-size="14" fill="#111">load saved decode</text>
  <text x="180" y="188" text-anchor="middle" font-size="12" fill="#555">decoded once, reused</text>

  <!-- fallback branch -->
  <rect x="360" y="150" width="200" height="48" rx="8" fill="#f6f8fa" stroke="#333" stroke-width="1.5"/>
  <text x="460" y="170" text-anchor="middle" font-size="14" fill="#111">ordinary openpyxl</text>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#555">anything else</text>

  <!-- converge -->
  <line x1="180" y1="198" x2="295" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="198" x2="345" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="220" y="232" width="200" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="320" y="257" text-anchor="middle" font-size="14" fill="#111">same result</text>

  <line x1="320" y1="272" x2="320" y2="298" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- receipt -->
  <rect x="170" y="300" width="300" height="48" rx="8" fill="#fff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="320" text-anchor="middle" font-size="14" fill="#111">receipt records which path was taken</text>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#555">direct (BUILT / REUSED) or reference</text>
</svg>
